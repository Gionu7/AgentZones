# Default zone config used by `docker compose up` and `./scripts/up.sh`.
# Every value can be overridden with environment variables (see .env.example).
name: ${ZONE_NAME:-my-zone}
host: ${ZONE_HOST:-0.0.0.0}
port: ${ZONE_PORT:-7700}
advertise_url: ${ZONE_URL:-}          # how peers reach this zone, e.g. http://10.1.2.3:7700
data_dir: ${ZONE_DATA:-./.zone-data/my-zone}
tags: ["${ZONE_PROFILE:-uniform}"]

model:                                 # any OpenAI-compatible endpoint (Ollama, llama.cpp, vLLM)
  provider: ${MODEL_PROVIDER:-openai}
  base_url: ${MODEL_URL:-http://localhost:11434/v1}
  model: ${MODEL_NAME:-qwen2.5:1.5b}

discovery:
  peers: ["${ZONE_SEED:-}"]            # any zone already in the network
  gossip_interval_s: 10
  peer_ttl_s: 60

security:
  # Ed25519 keys (auto-created) sign fix verifications; pin known zones here, else trust-on-first-use
  # trusted_keys: {zone-b: <base64 pubkey from zone-b's /api/info>}
  network_secret: ${ZONE_SECRET:-}     # same value on every zone of the network
  api_token: ${ZONE_API_TOKEN:-}       # protects /api/* from non-local callers
  allowed_cidrs: []                    # e.g. ["10.0.0.0/8"]

compute:
  share: ${ZONE_SHARE_MODEL:-false}    # lend this zone's model to peers (e.g. on an idle GPU server)
  max_concurrent: 2
  # size_b: 7                          # parsed from the model name if omitted
  # accept_from: [zone-a, zone-b]      # empty = every zone of the network

mcp_servers:
  - name: proxy
    command: python
    args: [-m, proxy_doctor.mcp_server]
    expose: [list_problems, propose_fix, check_proxy_env]   # tools peers may call

agents:
  - name: proxy-doctor
    kind: python
    impl: proxy_doctor.agent:ProxyDoctor
    description: Diagnoses and fixes corporate proxy and certificate problems
    options:
      confidence_threshold: 0.75
      investigate_with_llm: true   # local LLM investigates when classifier + peers stay unsure
      investigate_below: 0.5
      learn_from_verified: true    # verified diagnoses become local FL training data (never leave the zone)
      auto_apply: false                # real machine: propose fixes, don't apply
  - name: assistant
    kind: llm
    model_route: local                 # local | largest | any | <zone>: borrow a bigger model from the network
    description: General assistant using this zone's tools and peers
    system_prompt: You are an IT helper inside an Agent Zone. Use tools to check facts before answering.
    tools: ["proxy.*", "zone.search_fixes"]

federated:
  enabled: true
  task: proxy_doctor.student:ProxyStudentTask
  data:
    profile: ${ZONE_PROFILE:-uniform}  # stand-in for local incident data (see docs/FEDERATED.md)
    n_samples: 400                     # synthetic bootstrap; lower it as verified real cases accumulate
  aggregation: fedavg                  # fedavg (sample counts capped) | median | trimmed_mean
