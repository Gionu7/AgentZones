# Agent Zone on Kubernetes (one zone per namespace/cluster).
#   kubectl create namespace agentzone
#   kubectl -n agentzone create secret generic agentzone --from-literal=network-secret=CHANGE-ME
#   kubectl -n agentzone apply -f deploy/k8s/agentzone.yaml
# Peers in other clusters/VMs reach this zone via the LoadBalancer/Ingress address;
# set ZONE_URL to that address and ZONE_SEED to any existing zone.
apiVersion: v1
kind: ConfigMap
metadata: {name: agentzone-config}
data:
  ZONE_NAME: k8s-zone
  ZONE_URL: http://agentzone.example.internal:7700
  ZONE_SEED: ""
  ZONE_PROFILE: k8s-cluster
  MODEL_URL: http://ollama:11434/v1
  MODEL_NAME: qwen2.5:1.5b
  NO_PROXY: localhost,127.0.0.1,ollama,.svc,.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agentzone, labels: {app: agentzone}}
spec:
  replicas: 1          # a zone is stateful (peer table, fixes, FL model): keep 1 replica
  strategy: {type: Recreate}
  selector: {matchLabels: {app: agentzone}}
  template:
    metadata: {labels: {app: agentzone}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: zone
          image: agentzones:latest           # push to your registry (ACR) and change this
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 7700, name: http}]
          envFrom: [{configMapRef: {name: agentzone-config}}]
          env:
            - name: ZONE_CONFIG
              value: /app/zone.yaml
            - name: ZONE_SECRET
              valueFrom: {secretKeyRef: {name: agentzone, key: network-secret}}
          volumeMounts:
            - {name: config, mountPath: /app/zone.yaml, subPath: zone.yaml}
            - {name: data, mountPath: /data}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 30}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false}
      volumes:
        - name: config
          configMap: {name: agentzone-zone-yaml}
        - name: data
          persistentVolumeClaim: {claimName: agentzone-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: agentzone-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: agentzone}
spec:
  type: LoadBalancer   # or ClusterIP + Ingress with TLS (recommended)
  selector: {app: agentzone}
  ports: [{port: 7700, targetPort: http, name: http}]
---
# Local model server
apiVersion: apps/v1
kind: Deployment
metadata: {name: ollama, labels: {app: ollama}}
spec:
  replicas: 1
  selector: {matchLabels: {app: ollama}}
  template:
    metadata: {labels: {app: ollama}}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports: [{containerPort: 11434}]
          lifecycle:
            postStart:
              exec: {command: ["sh", "-c", "sleep 5; ollama pull qwen2.5:1.5b >/tmp/pull.log 2>&1 &"]}
          volumeMounts: [{name: models, mountPath: /root/.ollama}]
          resources:
            requests: {cpu: "1", memory: 3Gi}
            # limits: {nvidia.com/gpu: 1}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: ollama-models}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ollama-models}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: ollama}
spec:
  selector: {app: ollama}
  ports: [{port: 11434}]
---
# Only the zone may talk to the model; only allowed networks may reach the zone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ollama-only-from-zone}
spec:
  podSelector: {matchLabels: {app: ollama}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: agentzone}}}]
      ports: [{port: 11434}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: agentzone-ingress}
spec:
  podSelector: {matchLabels: {app: agentzone}}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: 10.0.0.0/8}}]   # peer zones' networks - adjust
      ports: [{port: 7700}]
