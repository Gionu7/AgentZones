# Site A - developer laptops (TLS interception)
# Seeds form a chain (c -> b -> a); gossip makes every zone discover every other.
name: ${ZONE_NAME:-zone-a}
host: ${ZONE_HOST:-127.0.0.1}
port: ${ZONE_PORT:-7701}
advertise_url: ${ZONE_URL:-http://127.0.0.1:7701}
data_dir: ${ZONE_DATA:-./.zone-data/zone-a}
tags: [dev-laptops]

model:
  provider: ${MODEL_PROVIDER:-openai}
  base_url: ${MODEL_URL:-http://localhost:11434/v1}
  model: ${MODEL_NAME:-qwen2.5:1.5b}

discovery:
  peers: ["${ZONE_SEED:-}"]
  gossip_interval_s: 3
  peer_ttl_s: 20

security:
  # Ed25519 keys (auto-created) sign fix verifications; pin known zones here, else trust-on-first-use
  # trusted_keys: {zone-b: <base64 pubkey from zone-b's /api/info>}
  network_secret: ${ZONE_SECRET:-hackathon-demo-secret}

mcp_servers:
  - name: proxy
    command: python
    args: [-m, proxy_doctor.mcp_server]
    expose: [list_problems, propose_fix, check_proxy_env]

agents:
  - name: proxy-doctor
    kind: python
    impl: proxy_doctor.agent:ProxyDoctor
    description: Diagnoses and fixes corporate proxy and certificate problems
    options:
      confidence_threshold: 0.75
      investigate_with_llm: true   # local LLM investigates when classifier + peers stay unsure
      investigate_below: 0.5
      learn_from_simulated: true   # demo: simulated verified cases also feed local training
      auto_apply: true          # simulated machines only; real machines need PROXY_DOCTOR_ALLOW_APPLY=1
      explain_with_llm: true    # falls back to a template if the model is not reachable
  - name: assistant
    kind: llm
    description: General assistant using this zone's tools and peers
    system_prompt: You are an IT helper inside an Agent Zone. Use tools to check facts before answering.
    tools: ["proxy.*", "zone.search_fixes"]

federated:
  enabled: true
  task: proxy_doctor.student:ProxyStudentTask
  data: {profile: dev-laptops, n_samples: 400}
  local_epochs: 5
  learning_rate: 0.5
