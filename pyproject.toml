[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentzones"
version = "0.1.0"
description = "Peer-to-peer, self-hosted AI agent zones: local LLM + MCP tools + gossip discovery + federated learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Only needed on the GPU box that runs distillation / fine-tuning.
distill = ["torch", "transformers>=4.44", "peft>=0.12", "datasets>=2.20", "accelerate"]

[project.scripts]
agentzone = "agentzones.cli:main"

[tool.setuptools.packages.find]
include = ["agentzones*", "proxy_doctor*"]

[tool.setuptools.package-data]
agentzones = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
